services:
  user-service:
    build: ./user-service
    container_name: user-service-app
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: always

  product-service:
    build: ./product-service
    container_name: product-service-app
    ports:
      - "3001:3001"
    networks:
      - app-network
    restart: always

  order-service:
    build: ./order-service
    container_name: order-service-app
    ports:
      - "3002:3002"
    networks:
      - app-network
    restart: always    

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service-app
    ports:
      - "3003:3003"
    networks:
      - app-network
    depends_on:
      - user-service
      - product-service
    restart: always

networks:
  app-network:
    driver: bridge
